services:
  postgres:
    image: postgres:16-alpine
    container_name: map-db
    ports:
      - "54324:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: map_dev
    volumes:
      - map_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: map-redis
    ports:
      - "6380:6379"
    volumes:
      - map_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  map_postgres_data:
  map_redis_data:
