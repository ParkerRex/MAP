name: Deploy to DigitalOcean Droplet

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to DigitalOcean Droplet
        uses: appleboy/ssh-action@master
        with:
          host: ${{secrets.HOST}}
          username: ${{secrets.USERNAME}}
          key: ${{secrets.KEY}}
          script: |
            export NVM_DIR=~/.nvm
            source ~/.nvm/nvm.sh
            rm -rf map
            mkdir map
            cd map
            GIT_SSH_COMMAND="ssh -i /root/.ssh/id_rsa_github" git clone git@github.com:parkerrex/map.git .
            echo 'Deployment to DigitalOcean finished'