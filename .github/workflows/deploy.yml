name: Deploy

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v3
      
      - name: Install system dependencies
        run: |
          sudo -n apt-get update
          sudo -n apt-get install -y build-essential libcairo2-dev libpango1.0-dev libjpeg-dev libgif-dev librsvg2-dev pkg-config

      - name: Setup Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: Build
        run: bun run build

      - name: Start or Restart PM2 processes
        run: |
          pm2 delete all || true
          pm2 start ecosystem.config.js
          pm2 save

      - name: Reload Nginx
        run: sudo -n systemctl reload nginx