name: Deploy

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v3

      - name: Setup Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: Build and deploy
        run: |
          bun run deploy
        env:
          NODE_OPTIONS: "--max-old-space-size=4096"

      - name: Reload Nginx
        run: sudo systemctl reload nginx