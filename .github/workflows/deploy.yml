name: Deploy

on:
  push:
    branches: [main]  # Adjust this if your main branch has a different name

jobs:
  deploy:
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v3
      
      - name: Setup Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: Build
        run: bun run build

      - name: Start or Restart PM2 processes
        run: |
          pm2 delete all || true
          pm2 start ecosystem.config.js
          pm2 save

      - name: Reload Nginx
        run: sudo systemctl reload nginx