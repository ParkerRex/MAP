# TODO: Swap this for real env
compatibility_date = "2023-12-01"
workers_dev = false
logpush = true

[env.production]
name = "engine"
route = { pattern = "engine.mapthemap.com/*", zone_name = "mapthemap.com" }

kv_namespaces = [
  { binding = "KV", id = "1ce9f0355d854a569f72bfccbfbea369" }
]

r2_buckets = [
  { binding = "STORAGE", bucket_name = "engine-assets", preview_bucket_name = "", jurisdiction = "us" }
]

[env.staging]
name = "engine-staging"
route = { pattern = "engine-staging.mapthemap.com/*", zone_name = "mapthemap.com" }

kv_namespaces = [
  { binding = "KV", id = "825dc18b2a38463492ff0db06ba99fc8" }
]

r2_buckets = [
  { binding = "STORAGE", bucket_name = "engine-assets", preview_bucket_name = "", jurisdiction = "us" }
]